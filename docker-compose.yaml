services:
  database:
    image: postgres:16-alpine
    container_name: farmconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmconnect_db
      POSTGRES_USER: farmconnect_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      farmconnect:
        aliases:
          - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmconnect-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - media_data:/app/media
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: farmconnect_db
      DB_USER: farmconnect_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
      ALLOWED_HOSTS: farmconnect.hpc.ac.zw,10.50.103.90
      FRONTEND_URL: https://farmconnect.hpc.ac.zw
    depends_on:
      database:
        condition: service_healthy
    networks:
      - farmconnect

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: farmconnect-frontend
    restart: unless-stopped
    volumes:
      - media_data:/usr/share/nginx/html/media:ro
    depends_on:
      - backend
    networks:
      - farmconnect

  nginx:
    image: nginx:alpine
    container_name: farmconnect-nginx
    restart: unless-stopped
    ports:
      - "10.50.103.90:8080:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - farmconnect

volumes:
  postgres_data:
  media_data:

networks:
  farmconnect:
    driver: bridge