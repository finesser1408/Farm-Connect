# ────────────────────────────────────────────────────────────────────────
# nginx location blocks for farmconnect.zchpc.ac.zw
#
# Paste these INSIDE the existing `server { ... }` block of the site's vhost
# using CloudPanel:  Sites -> your site -> Vhost
#
# CloudPanel validates the vhost and reverts invalid config, and regeneration
# can overwrite manual edits, so keep a copy of this file (the saved version
# normally lives at /etc/nginx/sites-enabled/farmconnect.zchpc.ac.zw.conf).
# Re-check the vhost after any site change in CloudPanel.
#
# Adjust `root` and the `alias` paths to wherever you uploaded the project.
# ────────────────────────────────────────────────────────────────────────

    # Product image uploads from the farmer dashboard.
    client_max_body_size 20m;

    # ── React app (SPA) ────────────────────────────────────────────────
    # try_files is what makes /login, /checkout, /verify-email and the
    # /password_reset/<uid>/<token> email links work: without it every
    # deep link returns nginx 404.
    root /var/www/farm-fresh-hub/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Django API ─────────────────────────────────────────────────────
    # No trailing slash on proxy_pass: the request URI passes through
    # unchanged, so /api/v1/products/ reaches Django as /api/v1/products/.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django admin ───────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django admin / static assets (manage.py collectstatic) ─────────
    location /static/ {
        alias /var/www/farm-fresh-hub/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # ── Uploaded product images (MEDIA_ROOT) ───────────────────────────
    location /media/ {
        alias /var/www/farm-fresh-hub/backend/media/;
        access_log off;
        expires 7d;
    }
